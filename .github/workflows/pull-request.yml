name: MAIN_PULL_REQUEST

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_email
        run: |
          log_emails=$(git log --pretty=format:"%ae %ce" -1) && if [[ ${log_emails} =~ '@tencent.com' ]];then echo $log_emails && echo "邮箱校验非法" && exit 2;else echo "邮箱校验通过";fi
        shell: bash

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tdesign-react
        uses: actions/checkout@v4
        with:
          repository: Tencent/tdesign-react
          submodules: recursive

      - name: Checkout tdesign-common
        uses: actions/checkout@v4
        with:
          path: packages/common
          
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: pnpm install

      - run: pnpm run lint

      - run: pnpm run test

      - name: Save pr id
        run: echo ${{ github.event.number }} > pr-id.txt

      - name: Upload pr id
        uses: actions/upload-artifact@v4
        with:
          name: pr-id
          path: pr-id.txt
          retention-days: 5